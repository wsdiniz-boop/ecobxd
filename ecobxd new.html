    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }

        }
        .icon-float {
            animation: float 3s ease-in-out infinite;
        }
        .icon-float:hover {
            animation-play-state: paused;
            transform: scale(1.15);
            transition: transform 0.2s ease;
        }
        @keyframes pulse-text {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.97); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .splash-cta {
            animation: pulse-text 1.6s ease-in-out infinite;
        }

            animation: fade-in-up 0.7s ease forwards;

<body class="bg-black text-gray-100 font-sans antialiased overflow-x-hidden">
    <div id="root" class="min-h-screen"></div>

    <script>
        // --- DADOS E CONTEÚDOS ---
        const CONTEUDOS = {
            flora: {
                title: 'Flora da Baixada',
                icon: 'fa-leaf',
                color: 'text-green-600',
                barColor: 'bg-green-500',
                borderColor: 'border-green-400',
                bgColor: 'bg-green-100',
                content: `
                    <div class="space-y-6 text-gray-700">
                        <h3 class="font-bold text-xl text-green-800">Principais Reservas e Parques Florestais</h3>
                        <p>A Baixada Fluminense abriga importantes fragmentos de Mata Atlântica. Destacam-se a <strong>Reserva Biológica do Tinguá</strong> (Nova Iguaçu) e o <strong>Parque Natural Municipal de Nova Iguaçu</strong> (Parque do Vulcão), além da APA Guandu-Jacatirão.</p>
                        <div class="w-full rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('parque_municipal_nova_iguacu')">
                            <img src="parque_municipal_nova_iguacu.jpg" alt="Parque Municipal de Nova Iguaçu" class="w-full h-56 object-cover">
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                <span class="text-white font-bold text-base drop-shadow">🌿 Parque Natural Municipal de Nova Iguaçu</span>
                                <p class="text-white/80 text-xs mt-0.5">Reserva de Mata Atlântica — Parque do Vulcão</p>
                            </div>
                        </div>

                        <h3 class="font-bold text-xl text-green-800">Principais Espécimes Nativas</h3>
                        <p>Entre a rica flora local, encontramos árvores imponentes como o Jequitibá-rosa, Ipê-amarelo, Quaresmeira, Pau-brasil e diversas espécies de bromélias e orquídeas nativas que compõem o sub-bosque.</p>

                        <div class="grid grid-cols-1 gap-4">
                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('jequitiba_rosa')">
                                <img src="jequitiba_rosa.jpg" alt="Jequitibá-rosa" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🌳 Jequitibá-rosa</span>
                                    <p class="text-white/80 text-xs">Uma das maiores árvores da Mata Atlântica</p>
                                </div>
                            </div>

                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('ipe_amarelo')">
                                <img src="ipe_amarelo.png" alt="Ipê-amarelo" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🌼 Ipê-amarelo</span>
                                    <p class="text-white/80 text-xs">Árvore símbolo do Brasil</p>
                                </div>
                            </div>

                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('quaresmeira')">
                                <img src="quaresmeira.jpg" alt="Quaresmeira" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🌸 Quaresmeira</span>
                                    <p class="text-white/80 text-xs">Flores roxas que ornamentam a Baixada</p>
                                </div>
                            </div>

                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('pau_brasil')">
                                <img src="pau_brasil.jpg" alt="Pau-brasil" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🪵 Pau-brasil</span>
                                    <p class="text-white/80 text-xs">Espécie que deu nome ao nosso país</p>
                                </div>
                            </div>
                        </div>

                        <h3 class="font-bold text-xl text-green-800">Ações de Preservação</h3>
                        <p>Ações incluem o reflorestamento de matas ciliares, fiscalização contra o desmatamento ilegal, projetos de educação ambiental nas escolas e a criação de corredores ecológicos para conectar fragmentos florestais isolados.</p>
                    </div>`
            },
            fauna: {
                title: 'Fauna Local',
                icon: 'fa-dove',
                color: 'text-orange-600',
                barColor: 'bg-orange-500',
                borderColor: 'border-orange-400',
                bgColor: 'bg-orange-100',
                content: `
                    <div class="space-y-6 text-gray-700">
                        <h3 class="font-bold text-xl text-orange-800">Principais Espécimes Nativas</h3>
                        <p>A fauna é rica e diversificada. Inclui aves como o Tiê-sangue e o Tucano-de-bico-preto; mamíferos como preguiças, pacas, tatus e, em áreas preservadas, onças-pardas; além de répteis como o Jacaré-de-papo-amarelo nos rios e pântanos.</p>

                        <div class="grid grid-cols-1 gap-4">
                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('tiesangue')">
                                <img src="tiesangue.jpg" alt="Tiê-sangue" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🐦 Tiê-sangue</span>
                                    <p class="text-white/80 text-xs">Ave nativa da Mata Atlântica</p>
                                </div>
                            </div>

                            <div class="rounded-xl overflow-hidden shadow-md relative img-card bg-zinc-900" onclick="openImageModal('tucano_bico_preto')">
                                <img src="tucano_bico_preto.jpg" alt="Tucano-de-bico-preto" class="w-full h-52 object-contain">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🦜 Tucano-de-bico-preto</span>
                                    <p class="text-white/80 text-xs">Símbolo da biodiversidade local</p>
                                </div>
                            </div>

                            <div class="rounded-xl overflow-hidden shadow-md relative img-card" onclick="openImageModal('jacare_papo_amarelo')">
                                <img src="jacare_papo_amarelo.jpg" alt="Jacaré-de-papo-amarelo" class="w-full h-44 object-cover">
                                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent px-4 py-3">
                                    <span class="text-white font-bold text-sm drop-shadow">🦎 Jacaré-de-papo-amarelo</span>
                                    <p class="text-white/80 text-xs">Réptil nativo dos rios e pântanos da região</p>
                                </div>
                            </div>
                        </div>

                        <h3 class="font-bold text-xl text-orange-800">Desafios do Tráfico de Animais</h3>

        // --- FUNÇÕES DE RASTREAMENTO DE TEMPO E RETENÇÃO ---
        function startTracker(key) {
            stopTracker(false);

            if (stats.conteudos[key]) {
                stats.conteudos[key].acessos++;
                activeTracker = {
                    key: key,
                    startTime: Date.now()
                };
            }
        }

        function stopTracker(markedAsCompleted = false) {
            if (!activeTracker) return;

            const { key, startTime } = activeTracker;
            const elapsedSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
            const record = stats.conteudos[key];

            if (record) {
                record.tempoTotalSeg += elapsedSec;
                if (elapsedSec >= RETENTION_THRESHOLD_SEC) {
                    record.retencoes++;
                }
                if (markedAsCompleted) {
                    record.concluidos++;
                }
            }

            activeTracker = null;
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeTracker) {
                const key = activeTracker.key;
                stopTracker(false);
                window._pausedTrackerKey = key;
            } else if (!document.hidden && window._pausedTrackerKey) {
                const key = window._pausedTrackerKey;
                window._pausedTrackerKey = null;
                if ((currentScreen === 'content' && activeTopic === key) || (currentScreen === 'quiz' && key === 'quiz')) {
                    activeTracker = { key: key, startTime: Date.now() };
                }
            }
        });

        function formatDuration(totalSeconds) {
            if (!totalSeconds || totalSeconds <= 0) return '0s';
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            if (mins === 0) return `${secs}s`;
            return `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
        }

        // --- FUNÇÕES UTILITÁRIAS ---
        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';
            
            switch (currentScreen) {
                case 'splash': root.innerHTML = getSplashHTML(); initSplash(); break;
                case 'login':  root.innerHTML = getLoginHTML(); initLoginIdle(); break;
                case 'home': root.innerHTML = getHomeHTML(); break;
                case 'content': root.innerHTML = getContentHTML(); break;
                case 'quiz': root.innerHTML = getQuizHTML(); break;
                case 'result': root.innerHTML = getResultHTML(); break;
                case 'koudan_panel': root.innerHTML = getDashboardAdminHTML(true); break;
                case 'admin_panel': root.innerHTML = getDashboardAdminHTML(false); break;
            }
            window.scrollTo(0, 0);
        }

        // --- IDLE TIMER (LOGIN) ---
        function initLoginIdle() {
            clearIdleTimer();
            const IDLE_MS = 10000;

            const reset = () => {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    if (currentScreen === 'login') {
                        currentScreen = 'splash';
                        render();
                    }
                }, IDLE_MS);
            };

            reset();

            const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
            const handler = () => {
                if (currentScreen !== 'login') {
                    clearIdleTimer();
                    events.forEach(ev => document.removeEventListener(ev, handler));
                    return;
                }
                reset();
            };
            events.forEach(ev => document.addEventListener(ev, handler, { passive: true }));

            idleTimer._handler = handler;
            idleTimer._events  = events;
        }

        function clearIdleTimer() {
            if (idleTimer) {
                clearTimeout(idleTimer);
                if (idleTimer._events && idleTimer._handler) {
                    idleTimer._events.forEach(ev =>
                        document.removeEventListener(ev, idleTimer._handler)
                    );
                }
                idleTimer = null;
            }
        }

        function toggleAdminLogin(show) {
            showAdminLogin = show;
            render();
        }

        // --- LÓGICA DE LOGIN / REGISTO ---
        function handleRegisterPlayer(e) {
            e.preventDefault();
            const regName = document.getElementById('regName').value;
            const regAge  = document.getElementById('regAge').value;
            const regEdu  = document.getElementById('regEdu').value;

            if(!regName || !regAge) return;

            const ageNum = parseInt(regAge);
            let ageCat = ageNum <= 13 ? 'ate13' : ageNum <= 20 ? '14a20' : ageNum <= 35 ? '21a35' : ageNum <= 50 ? '36a50' : '51mais';

            const newUser = { id: Date.now(), name: regName, role: 'jogador', age: ageNum, education: regEdu };

            stats.hoje++; stats.semana++; stats.mes++;
            stats.ages[ageCat]++;
            stats.education[regEdu]++;
            stats.jogadores.unshift(regName);

            usersDb.push(newUser);
            currentUser = newUser;
            clearIdleTimer();
            currentScreen = 'home';
            render();
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const loginStr = document.getElementById('adminLogin').value.trim();
            const p1Str   = document.getElementById('pass1').value.trim();
            const p2Str   = document.getElementById('pass2').value.trim();
            const errorMsg = document.getElementById('login-error');

            // 1. Koudan nativo
            if (loginStr === 'Wanderson KS Santos' && p1Str === 'kurogane' && p2Str === 'hwarangdo') {
                clearIdleTimer();
                currentUser = { id: 1, name: 'Wanderson KS Santos', role: 'koudan' };
                currentScreen = 'koudan_panel';
                render();
                return;
            }

            // 2. Perfil Admin Nativo "cliente" (Apenas visualização)
            if (loginStr === 'cliente' && p1Str === '1234') {
                clearIdleTimer();
                currentUser = { id: 2, name: 'cliente', role: 'cliente_nativo' };
                currentScreen = 'admin_panel';
                render();
                return;
            }

            // 3. Koudans dinâmicos
            const dynKoudan = usersDb.find(u =>
                u.role === 'koudan' && !u.native && u.login === loginStr && u.pass1 === p1Str && u.pass2 === p2Str
            );
            if (dynKoudan) {
                clearIdleTimer();
                currentUser = { id: dynKoudan.id, name: dynKoudan.login, role: 'koudan' };
                currentScreen = 'koudan_panel';
                render();
                return;
            }

            // 4. Admin Temp dinâmico
            const today = new Date().toISOString().split('T')[0];
            const dynAdmin = usersDb.find(u =>
                u.role === 'admin_temp' && u.login === loginStr && u.pass1 === p1Str && u.expiry >= today
            );
            if (dynAdmin) {
                clearIdleTimer();
                currentUser = { id: dynAdmin.id, name: dynAdmin.login, role: 'admin_temp' };
                currentScreen = 'admin_panel';
                render();
                return;
            }

            // 5. Admin Temp expirado
            const expiredAdmin = usersDb.find(u =>
                u.role === 'admin_temp' && u.login === loginStr && u.pass1 === p1Str
            );
            if (expiredAdmin) {
                errorMsg.textContent = `Acesso expirado em ${expiredAdmin.expiry}.`;
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.textContent = 'Credenciais inválidas.';
            errorMsg.classList.remove('hidden');
        }

            stopTracker(false);
            window._pausedTrackerKey = null;
            clearIdleTimer();
            currentUser = null;

        // --- LÓGICA DO QUIZ ---
        function startQuiz() {
            const questions = QUIZ_QUESTIONS.map(q => {
                const options = shuffleArray([q.r, ...q.err]);
                return { ...q, options };
            });
            quizQuestions = shuffleArray(questions);
            currentQIndex = 0;

            currentScreen = 'quiz';

        function handleAnswer(answer) {
            const isCorrect = answer === quizQuestions[currentQIndex].r;
            if (isCorrect) score++;

                        <h1 class="text-5xl font-black mb-2">${score}/10</h1>
                        <p class="text-xl mb-6 font-medium">Acertos</p>
                        <div class="bg-white text-gray-800 p-6 rounded-2xl shadow-xl mb-8">
                            <p class="font-bold text-lg italic">"${message}"</p>
                        </div>
                        <button onclick="goHome(false)" class="w-full bg-white text-gray-900 hover:bg-gray-100 font-bold py-4 rounded-xl transition-all shadow-lg">
                            Voltar para o Início
                        </button>
                    </div>
                </div>
            `;
        }

        function getDashboardAdminHTML(isKoudan) {
            const isClienteView = currentUser && currentUser.role === 'cliente_nativo';
            const panelTitle = isKoudan
                ? 'Painel Koudan'
                : (isClienteView ? 'Painel Cliente (Visualização)' : 'Painel Admin Temp');

            const playersHTML = stats.jogadores.length > 0
                ? stats.jogadores.map(nome => `<span class="bg-zinc-700 text-gray-300 px-3 py-1 rounded-full text-sm">${nome}</span>`).join('')
                : `<p class="text-zinc-600 text-sm italic">Nenhum jogador registrado ainda.</p>`;

            // Monta os cartões de Tempo e Retenção para cada conteúdo + Quiz
            const topicKeys = [...Object.keys(CONTEUDOS), 'quiz'];
            const contentRetentionHTML = topicKeys.map(key => {
                const isQuiz = key === 'quiz';
                const label = isQuiz ? '🏆 Desafio Quiz' : CONTEUDOS[key].title;
                const barColor = isQuiz ? 'bg-emerald-500' : CONTEUDOS[key].barColor;
                const data = stats.conteudos[key];

                const avgSec = data.acessos > 0 ? Math.round(data.tempoTotalSeg / data.acessos) : 0;
                const retentionPct = data.acessos > 0 ? Math.round((data.retencoes / data.acessos) * 100) : 0;

                return `
                    <div class="bg-zinc-800 p-4 rounded-xl border border-zinc-700">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-gray-100 text-sm">${label}</span>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-zinc-700 text-emerald-400">
                                Retenção: ${retentionPct}%
                            </span>
                        </div>

                        <!-- Barra de Retenção -->
                        <div class="w-full bg-zinc-700 rounded-full h-2 mb-3 overflow-hidden">
                            <div class="${barColor} h-2 rounded-full transition-all duration-300" style="width: ${retentionPct}%"></div>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs text-gray-400">
                            <div class="bg-zinc-900 p-2 rounded-lg">
                                <span class="block text-zinc-500">Acessos</span>
                                <span class="font-bold text-gray-200 text-sm">${data.acessos}</span>
                            </div>
                            <div class="bg-zinc-900 p-2 rounded-lg">
                                <span class="block text-zinc-500">Tempo Médio</span>
                                <span class="font-bold text-blue-300 text-sm">${formatDuration(avgSec)}</span>
                            </div>
                            <div class="bg-zinc-900 p-2 rounded-lg">
                                <span class="block text-zinc-500">Tempo Total</span>
                                <span class="font-bold text-gray-200 text-sm">${formatDuration(data.tempoTotalSeg)}</span>
                            </div>
                            <div class="bg-zinc-900 p-2 rounded-lg">
                                <span class="block text-zinc-500">${isQuiz ? 'Finalizados' : 'Lidos até o fim'}</span>
                                <span class="font-bold text-green-400 text-sm">${data.concluidos}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="min-h-screen bg-black pb-10">
                    <header class="bg-zinc-900 border-b border-zinc-700 text-white p-4 shadow-md flex justify-between items-center">
                        <h1 class="font-bold text-xl flex items-center gap-2">
                            ⚙️ ${panelTitle}
                        </h1>
                        <button onclick="logout()" class="text-sm flex items-center gap-1 hover:text-gray-300">
                            🚪 Sair
                        </button>
                    </header>

                    <div class="max-w-4xl mx-auto p-4 py-8 space-y-6">
                        <!-- STATISTICS SECTION -->
                        <section class="bg-zinc-900 p-6 rounded-2xl shadow-sm border border-zinc-700">
                            <h2 class="text-xl font-bold text-gray-100 mb-6 flex items-center gap-2">
                                📊 <span>Estatísticas de Interação</span>
                            </h2>
                            <div class="grid grid-cols-3 gap-4 mb-8">
                                <div class="bg-zinc-800 p-4 rounded-xl text-center">
                                    <p class="text-sm text-blue-400 font-bold uppercase">Hoje</p>
                                    <p class="text-3xl font-black text-blue-300">${stats.hoje}</p>
                                </div>
                                <div class="bg-zinc-800 p-4 rounded-xl text-center">
                                    <p class="text-sm text-blue-400 font-bold uppercase">Semana</p>
                                    <p class="text-3xl font-black text-blue-300">${stats.semana}</p>
                                </div>
                                <div class="bg-zinc-800 p-4 rounded-xl text-center">
                                    <p class="text-sm text-blue-400 font-bold uppercase">Mês</p>
                                    <p class="text-3xl font-black text-blue-300">${stats.mes}</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <h3 class="font-bold text-gray-300 mb-3 border-b border-zinc-700 pb-2">Acessos por Idade</h3>
                                    <ul class="space-y-2 text-sm text-gray-400">
                                        <li class="flex justify-between"><span>Até 13 anos:</span> <span class="font-bold text-gray-100">${stats.ages['ate13']}</span></li>
                                        <li class="flex justify-between"><span>14 a 20 anos:</span> <span class="font-bold text-gray-100">${stats.ages['14a20']}</span></li>
                                        <li class="flex justify-between"><span>21 a 35 anos:</span> <span class="font-bold text-gray-100">${stats.ages['21a35']}</span></li>
                                        <li class="flex justify-between"><span>36 a 50 anos:</span> <span class="font-bold text-gray-100">${stats.ages['36a50']}</span></li>
                                        <li class="flex justify-between"><span>51 anos ou mais:</span> <span class="font-bold text-gray-100">${stats.ages['51mais']}</span></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-300 mb-3 border-b border-zinc-700 pb-2">Acessos por Escolaridade</h3>
                                    <ul class="space-y-2 text-sm text-gray-400">
                                        <li class="flex justify-between"><span>Ensino Fundamental:</span> <span class="font-bold text-gray-100">${stats.education['Fundamental']}</span></li>
                                        <li class="flex justify-between"><span>Ensino Médio:</span> <span class="font-bold text-gray-100">${stats.education['Medio']}</span></li>
                                        <li class="flex justify-between"><span>Ensino Superior:</span> <span class="font-bold text-gray-100">${stats.education['Superior']}</span></li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="mt-8">
                                <h3 class="font-bold text-gray-300 mb-3 border-b border-zinc-700 pb-2 flex items-center gap-2">
                                    👥 Últimos Jogadores Cadastrados
                                </h3>
                                <div class="flex flex-wrap gap-2">
                                    ${playersHTML}
                                </div>
                            </div>
                        </section>

                        <!-- TEMPO E RETENÇÃO POR CONTEÚDO -->
                        <section class="bg-zinc-900 p-6 rounded-2xl shadow-sm border border-zinc-700">
                            <div class="flex flex-wrap justify-between items-center gap-2 mb-6">
                                <h2 class="text-xl font-bold text-gray-100 flex items-center gap-2">
                                    ⏱️ <span>Tempo e Retenção por Conteúdo</span>
                                </h2>
                                <span class="text-xs text-zinc-400">Retenção = permanência ≥ ${RETENTION_THRESHOLD_SEC}s</span>
                            </div>
                            <div class="space-y-3">
                                ${contentRetentionHTML}
                            </div>
                        </section>

                        <!-- KOUDAN SPECIFIC ACTIONS (Exclusivo Koudan; oculto para Admin Temp e Cliente) -->
                        ${isKoudan ? `
                        <section class="bg-zinc-900 p-6 rounded-2xl shadow-sm border border-zinc-700">
                            <h2 class="text-xl font-bold text-gray-100 mb-6 flex items-center gap-2">
                                ⚙️ <span>Gestão Koudan</span>
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <button onclick="openCadastroAdminModal()" class="bg-zinc-800 hover:bg-green-900/40 text-gray-300 hover:text-green-400 font-bold py-3 px-4 rounded-xl text-sm border border-zinc-600 hover:border-green-700 transition-all flex items-center justify-center gap-2">
                                    🛡️ Cadastrar Admin Temp
                                </button>
                                <button onclick="openCadastroKoudanModal()" class="bg-zinc-800 hover:bg-blue-900/40 text-gray-300 hover:text-blue-400 font-bold py-3 px-4 rounded-xl text-sm border border-zinc-600 hover:border-blue-700 transition-all flex items-center justify-center gap-2">
                                    👑 Cadastrar Novo Koudan
                                </button>
                                <button onclick="openGerenciarPerfisModal()" class="bg-red-900/20 hover:bg-red-900/40 text-red-400 font-bold py-3 px-4 rounded-xl text-sm border border-red-900/50 md:col-span-2 transition-all flex items-center justify-center gap-2">
                                    👥 Gerenciar Perfis Cadastrados
                                </button>
                            </div>
                        </section>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- GESTÃO KOUDAN ---
        function _koudanModalBase(id, titulo, corBorda, conteudo) {
            const old = document.getElementById(id);
            if (old) old.remove();
            const modal = document.createElement('div');
            modal.id = id;
            modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;';
            modal.onclick = e => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="modal-enter" style="background:#18181b;border-radius:1.25rem;max-width:440px;width:100%;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.7);border:1px solid ${corBorda};">
                    <div style="padding:1.5rem 1.5rem 0;">
                        <h2 style="color:#fff;font-size:1.1rem;font-weight:800;margin:0 0 1.25rem;">${titulo}</h2>
                        ${conteudo}
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }

        function openCadastroAdminModal() {
            _koudanModalBase('koudan-modal', '🛡️ Cadastrar Admin Temp', '#16a34a', `
                <form onsubmit="saveCadastroAdmin(event)" class="space-y-4" style="padding-bottom:1.5rem;">
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Login do Admin</label>
                        <input id="km-login" type="text" required placeholder="Nome de acesso"
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Senha Primária</label>
                        <input id="km-pass" type="password" required placeholder="Senha de acesso"
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Validade (data)</label>
                        <input id="km-expiry" type="date" required
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div id="km-error" style="display:none;background:#450a0a;color:#fca5a5;padding:0.5rem 0.75rem;border-radius:0.5rem;font-size:0.8rem;font-weight:600;"></div>
                    <div style="display:flex;gap:0.75rem;padding-top:0.25rem;">
                        <button type="button" onclick="document.getElementById('koudan-modal').remove()"
                            style="flex:1;padding:0.7rem;background:#27272a;color:#9ca3af;border:1px solid #3f3f46;border-radius:0.7rem;font-weight:700;cursor:pointer;">Cancelar</button>
                        <button type="submit"
                            style="flex:1;padding:0.7rem;background:#16a34a;color:#fff;border:none;border-radius:0.7rem;font-weight:700;cursor:pointer;">Cadastrar</button>
                    </div>
                </form>`);
        }

        function saveCadastroAdmin(e) {
            e.preventDefault();
            const login  = document.getElementById('km-login').value.trim();
            const pass   = document.getElementById('km-pass').value.trim();
            const expiry = document.getElementById('km-expiry').value;
            const err    = document.getElementById('km-error');

            if (usersDb.find(u => u.login === login)) {
                err.textContent = 'Este login já está em uso.';
                err.style.display = 'block';
                return;
            }
            usersDb.push({ id: Date.now(), login, role: 'admin_temp', pass1: pass, expiry });
            document.getElementById('koudan-modal').remove();
            const toast = Object.assign(document.createElement('div'), {
                textContent: `✅ Admin "${login}" cadastrado até ${expiry}.`
            });
            Object.assign(toast.style, { position:'fixed', bottom:'1.5rem', left:'50%', transform:'translateX(-50%)', background:'#16a34a', color:'#fff', padding:'0.75rem 1.5rem', borderRadius:'999px', fontWeight:'700', fontSize:'0.9rem', zIndex:'999999', whiteSpace:'nowrap' });
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function openCadastroKoudanModal() {
            _koudanModalBase('koudan-modal', '👑 Cadastrar Novo Koudan', '#2563eb', `
                <form onsubmit="saveCadastroKoudan(event)" class="space-y-4" style="padding-bottom:1.5rem;">
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Login do Koudan</label>
                        <input id="km-login" type="text" required placeholder="Nome completo de acesso"
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Senha Primária</label>
                        <input id="km-pass1" type="password" required placeholder="Primeira senha"
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div>
                        <label style="color:#9ca3af;font-size:0.8rem;font-weight:600;display:block;margin-bottom:4px;">Senha Secundária</label>
                        <input id="km-pass2" type="password" required placeholder="Segunda senha"
                            style="width:100%;padding:0.6rem 0.75rem;background:#27272a;border:1px solid #3f3f46;border-radius:0.6rem;color:#fff;font-size:0.9rem;outline:none;box-sizing:border-box;">
                    </div>
                    <div id="km-error" style="display:none;background:#450a0a;color:#fca5a5;padding:0.5rem 0.75rem;border-radius:0.5rem;font-size:0.8rem;font-weight:600;"></div>
                    <div style="display:flex;gap:0.75rem;padding-top:0.25rem;">
                        <button type="button" onclick="document.getElementById('koudan-modal').remove()"
                            style="flex:1;padding:0.7rem;background:#27272a;color:#9ca3af;border:1px solid #3f3f46;border-radius:0.7rem;font-weight:700;cursor:pointer;">Cancelar</button>
                        <button type="submit"
                            style="flex:1;padding:0.7rem;background:#2563eb;color:#fff;border:none;border-radius:0.7rem;font-weight:700;cursor:pointer;">Cadastrar</button>
                    </div>
                </form>`);
        }

        function saveCadastroKoudan(e) {
            e.preventDefault();
            const login = document.getElementById('km-login').value.trim();
            const pass1 = document.getElementById('km-pass1').value.trim();
            const pass2 = document.getElementById('km-pass2').value.trim();
            const err   = document.getElementById('km-error');

            if (usersDb.find(u => u.login === login)) {
                err.textContent = 'Este login já está em uso.';
                err.style.display = 'block';
                return;
            }
            if (pass1 === pass2) {
                err.textContent = 'As senhas primária e secundária devem ser diferentes.';
                err.style.display = 'block';
                return;
            }
            usersDb.push({ id: Date.now(), login, role: 'koudan', pass1, pass2 });
            document.getElementById('koudan-modal').remove();
            const toast = Object.assign(document.createElement('div'), {
                textContent: `✅ Koudan "${login}" cadastrado com sucesso.`
            });
            Object.assign(toast.style, { position:'fixed', bottom:'1.5rem', left:'50%', transform:'translateX(-50%)', background:'#2563eb', color:'#fff', padding:'0.75rem 1.5rem', borderRadius:'999px', fontWeight:'700', fontSize:'0.9rem', zIndex:'999999', whiteSpace:'nowrap' });
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function openGerenciarPerfisModal() {
            const admins  = usersDb.filter(u => u.role === 'admin_temp');
            const koudans = usersDb.filter(u => u.role === 'koudan' && !u.native);

            const rowStyle = 'display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0.75rem;background:#27272a;border-radius:0.6rem;margin-bottom:0.5rem;';
            const delBtn   = id => `<button onclick="deleteProfile(${id})" style="background:#7f1d1d;color:#fca5a5;border:none;border-radius:0.4rem;padding:0.25rem 0.6rem;font-size:0.75rem;font-weight:700;cursor:pointer;">Excluir</button>`;

            const koudanRows = [
                `<div style="${rowStyle}"><span style="color:#93c5fd;font-size:0.85rem;">👑 Wanderson KS Santos <span style="color:#4b5563;font-size:0.7rem;">(nativo — não removível)</span></span></div>`,
                ...koudans.map(u => `<div style="${rowStyle}"><span style="color:#93c5fd;font-size:0.85rem;">👑 ${u.login}</span>${delBtn(u.id)}</div>`)
            ].join('');

            const adminRows = [
                `<div style="${rowStyle}"><span style="color:#6ee7b7;font-size:0.85rem;">👁️ cliente <span style="color:#4b5563;font-size:0.7rem;">(nativo — visualização)</span></span></div>`,
                ...admins.map(u => `<div style="${rowStyle}"><span style="color:#6ee7b7;font-size:0.85rem;">🛡️ ${u.login} <span style="color:#4b5563;font-size:0.7rem;">válido até ${u.expiry}</span></span>${delBtn(u.id)}</div>`)
            ].join('');

            _koudanModalBase('koudan-modal', '⚙️ Gerenciar Perfis', '#dc2626', `
                <div style="max-height:60vh;overflow-y:auto;padding-bottom:1.5rem;">
                    <p style="color:#6b7280;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;">Koudans</p>
                    ${koudanRows}
                    <p style="color:#6b7280;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin:1rem 0 0.5rem;">Admins / Visualizadores</p>
                    ${adminRows}
                    <button onclick="document.getElementById('koudan-modal').remove()"
                        style="margin-top:1.25rem;width:100%;padding:0.7rem;background:#27272a;color:#9ca3af;border:1px solid #3f3f46;border-radius:0.7rem;font-weight:700;cursor:pointer;box-sizing:border-box;">Fechar</button>
                </div>`);
        }

        function deleteProfile(id) {
            usersDb = usersDb.filter(u => u.id !== id);
            openGerenciarPerfisModal();
        }

        // --- INICIALIZAÇÃO ---
        render();
    </script>
</body>
</html>
